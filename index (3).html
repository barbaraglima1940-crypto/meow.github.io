<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#ffe8f2">
<title>♡ Miu — Pixel Kitty</title>
<style>
:root{--pink:#ffd8e8;--hot:#ed86b5;--ink:#60445a;--cream:#fff8f1}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 14% 22%,#fff 0 2px,transparent 3px),radial-gradient(circle at 76% 68%,#fff 0 2px,transparent 3px),linear-gradient(135deg,#fff8fc,#ffe8f2 55%,#fce1f3);background-size:85px 85px,120px 120px,auto}.topbar{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:9px;align-items:center;padding:10px 15px;border:2px solid white;border-radius:999px;background:#ffffffc9;box-shadow:0 6px 22px #d98bb522;white-space:nowrap;font-size:13px}.heart{color:#e978ac;font-size:18px}.controls{position:fixed;right:14px;top:16px;display:flex;gap:7px;z-index:7}button{border:2px solid white;background:#ffffffd9;color:#98617e;padding:9px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:12px;box-shadow:0 4px 14px #d98bb51a}button:hover{background:#fff}#stage{position:fixed;inset:0;overflow:hidden}#kitty{position:absolute;width:112px;height:112px;touch-action:none;user-select:none;cursor:grab;transform-origin:center;filter:drop-shadow(0 7px 0 #ca74a31f);z-index:3}#kitty:active{cursor:grabbing}#sprite{width:100%;height:100%;image-rendering:pixelated}.bubble{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);padding:7px 10px;border:2px solid #f8bfd8;border-radius:12px;background:white;color:#9e6381;opacity:0;pointer-events:none;white-space:nowrap;font-size:12px;transition:opacity .15s}.bubble:after{content:"";position:absolute;left:50%;bottom:-6px;width:8px;height:8px;background:white;border-right:2px solid #f8bfd8;border-bottom:2px solid #f8bfd8;transform:translateX(-50%) rotate(45deg)}#kitty.show-bubble .bubble{opacity:1}.hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:5;width:max-content;max-width:94%;text-align:center;color:#946b83;font-size:12px;line-height:1.5;background:#ffffffb8;border:1px solid white;padding:8px 13px;border-radius:14px}.toy{position:absolute;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;user-select:none;filter:drop-shadow(0 3px 2px #d98bb522);z-index:2}.yarn-ball{position:relative;width:27px;height:27px;border-radius:50%;background:repeating-linear-gradient(135deg,#d7193f 0 4px,#f04b68 4px 7px,#b90f32 7px 9px);border:2px solid #a80d2d;box-shadow:inset -3px -3px 0 #a80d2d55}.yarn-ball:before{content:"";position:absolute;width:11px;height:8px;right:-6px;top:17px;border:2px solid #d7193f;border-left-color:transparent;border-radius:50%;transform:rotate(25deg)}.yarn-ball:after{content:"";position:absolute;width:8px;height:10px;left:8px;top:5px;border:2px solid #ff9caf;border-radius:50%;transform:rotate(-35deg)}#status{position:fixed;left:14px;top:16px;z-index:5;font-size:11px;color:#a76c8d;background:#ffffffa8;border:1px solid #fff;padding:8px 10px;border-radius:15px}@media(max-width:650px){.topbar{left:12px;transform:none;top:14px;font-size:10px}.controls{top:58px;right:10px}.hint{bottom:9px;font-size:10px}#status{top:58px;left:10px}}@media(prefers-reduced-motion:reduce){.bubble{transition:none}}
</style></head><body>
<div class="topbar"><span class="heart">♡</span><strong>MIU'S LITTLE CORNER</strong><span>✿ pixel kitty ✿</span></div><div id="status">♡ mood: curiosa</div>
<div class="controls"><button id="pauseBtn" aria-pressed="false">Ⅱ pausar</button><button id="sleepBtn">☾ nanar</button><button id="soundBtn" aria-pressed="false">♫ som: off</button></div>
<main id="stage" aria-label="Miu, gatinha pixel art interativa"><div id="toy" class="toy" title="Clica no novelo vermelho para chamar a Miu" aria-label="Novelo vermelho"><span class="yarn-ball"></span></div><div id="kitty" role="img" aria-label="Gatinha pixel art cor-de-rosa"><div id="bubble" class="bubble">miau~ ♡</div><canvas id="sprite" width="32" height="32"></canvas></div></main>
<div class="hint">♡ Move o cursor para chamar a Miu · clica nela para carinho · clica no novelo vermelho para brincar ♡</div>
<script>(()=>{const kitty=document.querySelector('#kitty'),canvas=document.querySelector('#sprite'),ctx=canvas.getContext('2d'),stage=document.querySelector('#stage'),bubble=document.querySelector('#bubble'),status=document.querySelector('#status'),toy=document.querySelector('#toy'),pauseBtn=document.querySelector('#pauseBtn'),sleepBtn=document.querySelector('#sleepBtn'),soundBtn=document.querySelector('#soundBtn');ctx.imageSmoothingEnabled=false;let x=Math.max(8,innerWidth*.22),y=Math.max(100,innerHeight*.5),vx=.65,vy=.25,frame=0,paused=false,sleeping=false,dragging=false,dx=0,dy=0,target=null,toyMode=false,petUntil=0,mood='curiosa',soundOn=false,audioCtx=null,last=performance.now(),lastInteraction=last;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduced)paused=true;
function rect(c,x,y,w,h){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}function drawCat(){ctx.clearRect(0,0,32,32);const walk=Math.floor(frame/8)%2,bob=(!paused&&!sleeping&&!dragging&&walk)?1:0,chasing=toyMode,wag=chasing?[0,2,4,2,0,-2,-4,-2][Math.floor(frame/2)%8]:[0,1,0,-1][Math.floor(frame/7)%4];ctx.save();ctx.translate(0,bob);
// Rabo pixel art a abanar
rect('#f4c9d9',22,23,4,2);rect('#f4c9d9',25,21+wag/2,3,2);rect('#fff8f1',27,20+wag/2,2,2);
// Orelhas e cara
rect('#f4c9d9',5,4,7,9);rect('#f4c9d9',20,4,7,9);rect('#fff8f1',7,3,4,5);rect('#fff8f1',21,3,4,5);rect('#ef8eb7',7,6,3,4);rect('#ef8eb7',22,6,3,4);rect('#fff8f1',7,8,18,2);rect('#fff8f1',5,10,22,11);rect('#fff8f1',7,21,18,3);rect('#fff8f1',9,24,14,2);rect('#fff8f1',4,13,2,5);rect('#fff8f1',26,13,2,5);
if(sleeping){rect('#60445a',9,15,4,1);rect('#60445a',20,15,4,1);rect('#60445a',14,19,4,1)}else if(mood==='feliz'||performance.now()<petUntil){rect('#60445a',9,15,4,2);rect('#60445a',20,15,4,2);rect('#fff',10,14,1,1);rect('#fff',21,14,1,1);rect('#60445a',14,19,1,1);rect('#60445a',17,19,1,1)}else if(mood==='surpresa'){rect('#60445a',10,14,3,5);rect('#60445a',20,14,3,5);rect('#60445a',15,19,2,2)}else{const blink=frame%170>165;if(blink){rect('#60445a',9,16,4,1);rect('#60445a',20,16,4,1)}else{rect('#60445a',10,14,3,5);rect('#60445a',20,14,3,5);rect('#fff',10,14,1,1);rect('#fff',20,14,1,1)}rect('#60445a',15,19,1,1);rect('#60445a',14,20,1,1);rect('#60445a',16,20,1,1)}
rect('#d96f9c',15,18,2,1);rect('#f6a9c8',7,18,3,2);rect('#f6a9c8',22,18,3,2);rect('#d9b3c4',2,17,4,1);rect('#d9b3c4',3,19,3,1);rect('#d9b3c4',26,17,4,1);rect('#d9b3c4',26,19,3,1);rect('#ef8eb7',7,9,3,2);rect('#ef8eb7',22,9,3,2);rect('#fff',8,9,1,1);rect('#fff',23,9,1,1);rect('#ef8eb7',14,23,4,2);rect('#fff',15,23,1,1);rect('#fff8f1',8,24,6,4);rect('#fff8f1',18,24,6,4);if(walk&&!paused&&!sleeping&&!dragging){rect('#f4c9d9',7,27,6,2);rect('#fff8f1',19,25,5,5)}else{rect('#f4c9d9',8,27,5,2);rect('#f4c9d9',19,27,5,2)}ctx.restore()}
function bounds(){x=Math.max(0,Math.min(innerWidth-112,x));y=Math.max(75,Math.min(innerHeight-145,y))}function place(){kitty.style.left=x+'px';kitty.style.top=y+'px';kitty.style.transform=`scaleX(${vx<0?-1:1})`}function say(text,ms=1300){bubble.textContent=text;petUntil=performance.now()+ms;lastInteraction=performance.now()}function setMood(next,label){mood=next;status.textContent='♡ mood: '+label}function beep(freq=660,duration=.09){if(!soundOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.value=.035;osc.connect(gain);gain.connect(audioCtx.destination);osc.start();gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);osc.stop(audioCtx.currentTime+duration)}catch(e){}}
function pet(){sleeping=false;sleepBtn.textContent='☾ nanar';setMood('feliz','feliz!');say('purrr~ ♡',1700);beep(780,.12);for(let i=0;i<3;i++){const h=document.createElement('span');h.textContent=['♡','♥','✧'][i];Object.assign(h.style,{position:'fixed',left:(x+35+i*16)+'px',top:(y+5)+'px',color:['#ed86b5','#f4a5cb','#c99be8'][i],fontSize:'20px',pointerEvents:'none',zIndex:8,transition:'transform .9s, opacity .9s'});document.body.appendChild(h);requestAnimationFrame(()=>{h.style.transform=`translate(${(i-1)*12}px,-42px)`;h.style.opacity='0'});setTimeout(()=>h.remove(),950)}}function sleepToggle(){sleeping=!sleeping;target=null;toyMode=false;if(sleeping){setMood('sono','soninho');say('zzZ... ☾',999999);sleepBtn.textContent='☀ acordar';beep(330,.16)}else{petUntil=0;setMood('curiosa','curiosa');say('bom dia! ♡');sleepBtn.textContent='☾ nanar';beep(600,.1)}}function spawnToy(){const tx=40+Math.random()*Math.max(40,innerWidth-100),ty=95+Math.random()*Math.max(40,innerHeight-180);toy.style.left=tx+'px';toy.style.top=ty+'px';target={x:tx,y:ty};toyMode=true;sleeping=false;sleepBtn.textContent='☾ nanar';setMood('brincando','hora de brincar');say('novelo vermelho!! ❤️',1000);beep(520,.08)}function moveToward(tx,ty,dt,speed){const cx=x+56,cy=y+56,ddx=tx-cx,ddy=ty-cy,dist=Math.hypot(ddx,ddy);if(dist>9){vx=ddx/dist*speed;vy=ddy/dist*speed;x+=vx*dt;y+=vy*dt}else if(toyMode){toyMode=false;target=null;setMood('feliz','brincando!');say('peguei!! ♡',1500);beep(880,.13);setTimeout(spawnToy,1700)}}function animate(now){const dt=Math.min(2,(now-last)/16.67);last=now;if(!paused&&!sleeping&&!dragging){if(toyMode&&target)moveToward(target.x,target.y,dt,1.55);else if(target)moveToward(target.x,target.y,dt,1.05);else{x+=vx*dt;y+=vy*dt;if(x<=0||x>=innerWidth-112)vx*=-1;if(y<=75||y>=innerHeight-145)vy*=-1;if(Math.random()<.008)vx=(Math.random()*.8+.35)*(Math.random()<.5?-1:1);if(Math.random()<.006)vy=(Math.random()*.4+.15)*(Math.random()<.5?-1:1)}bounds();frame++}if(now>petUntil&&!sleeping&&mood==='feliz')setMood('curiosa','curiosa');kitty.classList.toggle('show-bubble',now<petUntil);drawCat();place();requestAnimationFrame(animate)}
stage.addEventListener('pointermove',e=>{if(dragging||paused||sleeping||toyMode)return;if(e.clientY<65)return;if(Math.hypot(e.clientX-(x+56),e.clientY-(y+56))<230){target={x:e.clientX,y:e.clientY};setMood('curiosa','te seguindo')}else target=null});stage.addEventListener('pointerleave',()=>{if(!toyMode)target=null});kitty.addEventListener('pointerdown',e=>{dragging=true;target=null;dx=e.clientX-x;dy=e.clientY-y;kitty.setPointerCapture(e.pointerId);setMood('feliz','no colo');say('opa! ♡',900)});kitty.addEventListener('pointermove',e=>{if(!dragging)return;x=e.clientX-dx;y=e.clientY-dy;bounds();place()});kitty.addEventListener('pointerup',()=>{dragging=false;lastInteraction=performance.now()});kitty.addEventListener('pointercancel',()=>dragging=false);kitty.addEventListener('click',()=>{if(!dragging)pet()});pauseBtn.addEventListener('click',()=>{paused=!paused;pauseBtn.textContent=paused?'▶ continuar':'Ⅱ pausar';pauseBtn.setAttribute('aria-pressed',String(paused));if(paused)say('pausinha ♡');else say('voltei! ♡')});sleepBtn.addEventListener('click',sleepToggle);soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'♫ som: on':'♫ som: off';soundBtn.setAttribute('aria-pressed',String(soundOn));if(soundOn){beep(700,.12);say('miau~ ♡')}});toy.addEventListener('click',spawnToy);stage.addEventListener('dblclick',e=>{if(e.target===stage)spawnToy()});addEventListener('resize',()=>{bounds();place()});toy.style.left=Math.max(30,innerWidth*.72)+'px';toy.style.top=Math.max(100,innerHeight*.62)+'px';place();requestAnimationFrame(animate)})();</script></body></html>
